name: Acquire AWS UAT

on:
  pull_request:
    paths:
      - .github/workflows/aws-uat.yml
      - ops/aws/**
      - scripts/aws-uat-*
      - ops/app/**
      - src/**
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      operation:
        description: Build locally in CI, publish an image, or deploy an already-published app digest
        type: choice
        options: [build, publish, deploy]
        default: build
      image_digest:
        description: 'Deploy only: sha256 digest published from this source commit'
        type: string
        default: ''
      approval_reference:
        description: 'Deploy only: reference matching the exact UAT database review in the protected environment'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: acquire-aws-uat-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  AWS_DEFAULT_REGION: ap-southeast-2
  AWS_EC2_METADATA_DISABLED: 'true'
  AWS_PAGER: ''
  APP_ORIGIN: https://app.acquire.pajamaprofits.net
  ECR_REPOSITORY: 352329340196.dkr.ecr.ap-southeast-2.amazonaws.com/acquire-acquire-develop

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Check UAT guards and existing application boundaries
        run: |
          npm install --global pnpm@11.8.0
          pnpm install --frozen-lockfile
          node --test scripts/aws-uat-start.test.mjs scripts/aws-uat-release.test.mjs
          pnpm exec vitest run scripts/app-environment.test.mjs src/lib/request-origin.test.ts src/lib/google-oauth.test.ts src/app/api/health/ready/route.test.ts
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - name: Validate Terraform without a backend or AWS operations
        run: |
          terraform fmt -check -recursive ops/aws/terraform
          terraform -chdir=ops/aws/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=ops/aws/terraform validate
          terraform -chdir=ops/aws/terraform test

  image:
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy'
    needs: checks
    runs-on: ubuntu-24.04
    environment: aws-uat
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build existing standalone image and UAT-only startup layer
        run: |
          node scripts/app-image-build.mjs "$APP_ORIGIN" "acquire-app:uat-base-${GITHUB_SHA}"
          docker build --platform linux/amd64 -f ops/aws/uat/Dockerfile --build-arg "BASE_IMAGE=acquire-app:uat-base-${GITHUB_SHA}" -t "acquire-app:uat-${GITHUB_SHA}" .
      - name: Assume company deployment role with GitHub OIDC
        if: inputs.operation == 'publish'
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@17bd7357c7a3dff1ae12fd0e3f56f90c21093bb3
        with:
          role-arn: arn:aws:iam::352329340196:role/github-role
          region: ap-southeast-2
      - name: Verify account and push immutable release image
        if: inputs.operation == 'publish'
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = '352329340196'
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
          tag="app-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag "acquire-app:uat-${GITHUB_SHA}" "${ECR_REPOSITORY}:${tag}"
          docker push "${ECR_REPOSITORY}:${tag}"
          digest=$(aws ecr describe-images --repository-name acquire-acquire-develop --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)
          printf 'Published UAT image: `%s@%s`\n' "$ECR_REPOSITORY" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'
    needs: checks
    runs-on: ubuntu-24.04
    environment: aws-uat
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ACQUIRE_UAT_DEPLOYMENT_ENABLED: ${{ vars.ACQUIRE_UAT_DEPLOYMENT_ENABLED }}
      ACQUIRE_UAT_RELEASE_CONFIG: ${{ vars.ACQUIRE_UAT_RELEASE_CONFIG }}
      ACQUIRE_UAT_DATABASE_REVIEW: ${{ vars.ACQUIRE_UAT_DATABASE_REVIEW }}
      UAT_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      IMAGE_DIGEST: ${{ inputs.image_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - name: Require configured UAT release controls before AWS authentication
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { validateReleaseConfig } from './scripts/aws-uat-release.mjs';
          if (process.env.ACQUIRE_UAT_DEPLOYMENT_ENABLED !== 'true' || !/^sha256:[a-f0-9]{64}$/.test(process.env.IMAGE_DIGEST || '')) throw Error('Configure UAT deployment controls and select a published digest');
          const config = validateReleaseConfig(JSON.parse(process.env.ACQUIRE_UAT_RELEASE_CONFIG));
          const review = JSON.parse(process.env.ACQUIRE_UAT_DATABASE_REVIEW);
          if (!review.approvalReference || review.approvalReference !== process.env.UAT_APPROVAL_REFERENCE) throw Error('Select the exact reviewed database approval reference');
          writeFileSync(process.env.RUNNER_TEMP + '/acquire-uat-config.json', JSON.stringify(config), { mode: 0o600 });
          JS
      - name: Assume company deployment role with GitHub OIDC
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@17bd7357c7a3dff1ae12fd0e3f56f90c21093bb3
        with:
          role-arn: arn:aws:iam::352329340196:role/github-role
          region: ap-southeast-2
      - name: Register full reviewed task definition and capture rollback target
        id: register
        run: node scripts/aws-uat-release.mjs register "$RUNNER_TEMP/acquire-uat-config.json" "${ECR_REPOSITORY}@${IMAGE_DIGEST}"
      - name: Deploy one UAT app task and wait for readiness
        id: rollout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/update-ecs-service@17bd7357c7a3dff1ae12fd0e3f56f90c21093bb3
        with:
          cluster: acquire-acquire-develop
          service: acquire-app-develop
          task-definition-arn: ${{ steps.register.outputs.candidate }}
          desired-count: '1'
      - name: Public UAT liveness and sign-in smoke
        run: node scripts/aws-uat-release.mjs smoke
      - name: Restore previous task revision/count after failed rollout or smoke
        if: failure() && steps.register.outputs.candidate != ''
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/update-ecs-service@17bd7357c7a3dff1ae12fd0e3f56f90c21093bb3
        with:
          cluster: acquire-acquire-develop
          service: acquire-app-develop
          task-definition-arn: ${{ steps.register.outputs.previous }}
          desired-count: ${{ steps.register.outputs.previous_count }}
