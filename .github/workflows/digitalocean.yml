name: Deploy app to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acquire-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - name: Install and check deployment regressions
        run: |
          npm install --global pnpm@11.8.0
          pnpm install --frozen-lockfile
          pnpm exec vitest run scripts/app-environment.test.mjs src/lib/request-origin.test.ts src/lib/google-oauth.test.ts src/lib/channel-health.test.ts src/app/api/channels src/app/api/mailbox/google/redirects.test.ts src/app/api/health/ready/route.test.ts
          node --test scripts/app-public-smoke.test.mjs scripts/app-deploy-host.test.mjs
          bash -n scripts/app-deploy-host.sh
      - name: Build immutable production image
        run: |
          node scripts/app-image-build.mjs https://acquire.mlai.au "acquire-app:github-${GITHUB_SHA}"
          mkdir release
          docker save "acquire-app:github-${GITHUB_SHA}" | gzip > release/image.tar.gz
          docker image inspect "acquire-app:github-${GITHUB_SHA}" --format '{{.Id}}' > release/image-id
          printf '%s\n' "$GITHUB_SHA" > release/commit
          cp ops/app/compose.hosted.yml scripts/app-deploy-host.sh scripts/app-public-smoke.mjs release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acquire-app-${{ github.sha }}
          path: release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, acquire-production]
    environment:
      name: digitalocean-production
      url: https://acquire.mlai.au
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: acquire-app-${{ github.sha }}
          path: ${{ runner.temp }}/acquire-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy with readiness, public checks and rollback
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/acquire-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash "$RELEASE_DIRECTORY/app-deploy-host.sh" "$RELEASE_DIRECTORY" "$GITHUB_SHA"
      - name: Clean downloaded release
        if: always()
        env:
          RELEASE_DIRECTORY: ${{ runner.temp }}/acquire-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$RELEASE_DIRECTORY"
