name: Route smoke and coverage
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run scripts/route-inventory.test.ts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:routes
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        # Browser failures still fail their preceding mandatory test step.
        continue-on-error: true
        with:
          name: route-smoke
          path: |
            output/playwright/routes
            coverage/routes
          retention-days: 7
  unit-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage --maxWorkers 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        # Test and coverage summaries remain in logs if artifact storage is full.
        continue-on-error: true
        with:
          name: unit-coverage
          path: coverage/unit
          retention-days: 7
