---
name: dev

on:
  push:
    branches:
      - test/deployment

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}


jobs:
  target:
    runs-on: ubuntu-latest
    permissions: write-all
    env:
      AWS_ACCOUNT_ID: "352329340196"
      AWS_REGION: ap-southeast-2
      ENVIRONMENT: develop
      PROJECT: acquire
      SECRETS_ARN_SUFFIX: ZIJf1G
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          cache: true
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}

      - name: Generate backend and upload .env file
        run: |
          cat <<EOF > .env
          DATABASE_DRIVER=postgres
          APP_URL=https://app.acquire.pajamaprofits.net
          NEXT_PUBLIC_APP_URL=https://app.acquire.pajamaprofits.net
          TARGET_DATA_PROVIDER=fixture
          OUTREACH_DRAFTING_PROVIDER=fixture
          OPENROUTER_API_KEY=openai-temp-key
          RESEND_API_KEY=resend-tmp-key
          AUTH_EMAIL_FROM="Acquired <noreply@acquire.pajamaprofits.net>"
          ACQUIRE_DATABASE_PORT=5432
          ACQUIRE_DATABASE_NAME=${PROJECT}
          EOF


          SECRET_KEYS=(
            ACQUIRE_DATABASE_USERNAME
            ACQUIRE_DATABASE_PASSWORD
            ACQUIRE_DATABASE_HOST
            ACQUIRE_BETTER_AUTH_SECRET
          )

          SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "$SECRETS_ARN" --query SecretString --output text)

          for key in "${SECRET_KEYS[@]}"; do
            value=$(jq -r --arg k "$key" '.[$k] // ""' <<< "$SECRET_JSON")
            echo "${key}=${value}" >> .env
          done

          DOTENV="uvx --from python-dotenv[cli] dotenv -f .env"
          DB_USER=$($DOTENV get ACQUIRE_DATABASE_USERNAME)
          DB_PASSWORD=$($DOTENV get ACQUIRE_DATABASE_PASSWORD)
          DB_HOST=$($DOTENV get ACQUIRE_DATABASE_HOST)
          DB_PORT=$($DOTENV get ACQUIRE_DATABASE_PORT)
          DB_NAME=$($DOTENV get ACQUIRE_DATABASE_NAME)
          BETTER_AUTH_SECRET=$($DOTENV get ACQUIRE_BETTER_AUTH_SECRET)

          # Generate URL
          DATABASE_URL=$(jq -rn \
            --arg user "$DB_USER" --arg password "$DB_PASSWORD" \
            --arg host "$DB_HOST" --arg port "$DB_PORT" --arg name "$DB_NAME" \
            '"postgresql://\($user | @uri):\($password | @uri)@\($host):\($port)/\($name)"')
          
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}" >> .env

          # this is to remove "ACQUIRE_*" variables
          sed -i '/^ACQUIRE_/d' .env

          aws s3 sync env/ "s3://${ENV_FILES_BUCKET}/${ENV_FILE_PREFIX}/" --delete
        env:
          ENV_FILES_BUCKET: ${{ env.PROJECT }}-env-files-${{ env.ENVIRONMENT }}
          ENV_FILE_PREFIX: ${{ env.PROJECT_NAME }}
          SECRETS_ARN: arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:secret:${{ env.PROJECT }}-secrets-${{ env.ENVIRONMENT }}-${{ env.SECRETS_ARN_SUFFIX }}

      

