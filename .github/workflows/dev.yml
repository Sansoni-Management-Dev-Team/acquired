---
name: dev

on:
  push:
    branches:
      - test/deployment
  pull_request:
    branches: [test/deployment]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}


jobs:
  target:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "352329340196"
      AWS_REGION: ap-southeast-2
      ENVIRONMENT: develop
      PROJECT: acquire
      SECRETS_ARN_SUFFIX: ZIJf1G
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: true
      
      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}

      - name: Generate backend and upload .env file
        run: |

          umask 077
          mkdir -p env/${PROJECT}
          secret_file=$(mktemp)
          trap 'rm -f "$secret_file"; rm -rf env' EXIT
          aws secretsmanager get-secret-value --secret-id "$SECRETS_ARN" --query SecretString --output text > "$secret_file"
          node scripts/aws-dev-environment.mjs "$secret_file" "env/${PROJECT}/.env"
          aws s3 cp "env/${PROJECT}/.env" "s3://${ENV_FILES_BUCKET}/${PROJECT}/.env" --only-show-errors
        env:
          ACQUIRE_RESEARCH_ENABLED: ${{ vars.ACQUIRE_RESEARCH_ENABLED }}
          ACQUIRE_RESEARCH_WORKER_URL: ${{ vars.ACQUIRE_RESEARCH_WORKER_URL }}
          ENV_FILES_BUCKET: ${{ env.PROJECT }}-env-files-${{ env.ENVIRONMENT }}
          SECRETS_ARN: arn:aws:secretsmanager:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:secret:${{ env.PROJECT }}-secrets-${{ env.ENVIRONMENT }}-${{ env.SECRETS_ARN_SUFFIX }}

  lint:
    if: ${{ !cancelled() && (needs.target.result == 'success' || needs.target.result == 'skipped') }}
    needs:
      - target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENVIRONMENT: develop
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main

      - name: Setup pnpm
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: true
      
      - name: Install, build and verify standalone research service
        run: |
          npm --prefix services/research ci --ignore-scripts
          npm --prefix services/research run build
          npm --prefix services/research test
          node --test scripts/aws-dev-environment.test.mjs scripts/aws-research-release.test.mjs
      - name: Run lint
        run: pnpm lint

  docker:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.lint.result == 'success' }}
    needs:
      - lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "352329340196"
      AWS_REGION: ap-southeast-2
      ENVIRONMENT: develop
      PROJECT: acquire
      SECRETS_ARN_SUFFIX: ZIJf1G
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main

      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}

      - name: Set variables
        run: |
          echo "IMAGE_TAG=app-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=${PROJECT}-${PROJECT}-${ENVIRONMENT}" >> "$GITHUB_ENV"
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      
      - name: Build and push app, research and reader images
        env:
          IMAGE_REPOSITORY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PROJECT_NAME }}
        run: |
          bash scripts/build-aws-dev-images.sh "$IMAGE_REPOSITORY"
          for component in app research reader; do
            docker push "$IMAGE_REPOSITORY:$component-$GITHUB_SHA"
          done

  deploy:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.docker.result == 'success' && (needs.research-deploy.result == 'success' || needs.research-deploy.result == 'skipped') }}
    needs:
      - docker
      - research-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "352329340196"
      AWS_REGION: ap-southeast-2
      ENVIRONMENT: develop
      PROJECT: acquire
      SECRETS_ARN_SUFFIX: ZIJf1G
    steps:
      - name: Checkout
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/checkout@main

      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-role
          region: ${{ env.AWS_REGION }}

      - name: Set variables
        run: |
          echo "IMAGE_TAG=app-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=${PROJECT}-${PROJECT}-${ENVIRONMENT}" >> "$GITHUB_ENV"
      
      - name: Update taskdef.json placeholders
        run: |
          sed -i \
            -e "s|\${name}|$NAME|g" \
            -e "s|\${image}|$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME:$IMAGE_TAG|g" \
            -e "s|\${log_group}|$LOG_GROUP|g" \
            -e "s|\${region}|$AWS_REGION|g" \
            -e "s|\${env_file}|arn:aws:s3:::$ENV_FILES_BUCKET/$ENV_FILE_PREFIX/.env|g" \
            taskdef.json

          cat taskdef.json
        env:
          NAME: ${{ env.PROJECT }}
          REPO_NAME: ${{ env.PROJECT_NAME }}
          LOG_GROUP: /ecs/${{ env.PROJECT_NAME }}
          ENV_FILES_BUCKET: ${{ env.PROJECT }}-env-files-${{ env.ENVIRONMENT }}
          ENV_FILE_PREFIX: ${{ env.PROJECT }}

      - name: Register Backend Task Definition
        id: register
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/register-task-definition@main
        with:
          family: ${{ env.PROJECT_NAME }}
          taskdef-path: taskdef.json
          cpu: "256"
          memory: "1024"
          execution-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-ecs-task-execution-${{ env.ENVIRONMENT }}
          task-role-arn: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.PROJECT }}-${{ env.PROJECT }}-${{ env.ENVIRONMENT }}

      - name: Update ECS Service
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/update-ecs-service@main
        with:
          cluster: ${{ env.PROJECT_NAME }}
          service: ${{ env.PROJECT_NAME }}
          task-definition-arn: ${{ steps.register.outputs.task-definition-arn }}
          desired-count: "1"
          wait-for-stability: "true"


  pr-images:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.lint.result == 'success' }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build all UAT images without cloud credentials or database access
        run: bash scripts/build-aws-dev-images.sh acquire-pr

  research-deploy:
    if: ${{ !cancelled() && github.event_name == 'push' && needs.docker.result == 'success' }}
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assume Role
        uses: Sansoni-Management-Dev-Team/devops-github-workflows/assume-aws-role@main
        with:
          role-arn: arn:aws:iam::352329340196:role/github-role
          region: ap-southeast-2
      - name: Release the pre-provisioned single-worker service
        run: node scripts/aws-research-release.mjs
