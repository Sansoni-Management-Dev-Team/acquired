name: acquire-linkedin-testing
services:
  linkedin:
    image: acquire-linkedin:testing
    pull_policy: never
    container_name: acquire-linkedin-testing
    env_file: .env.testing
    environment:
      LINKEDIN_PUBLIC_URL: http://127.0.0.1:18097
      LINKEDIN_MAX_WORKERS: "1"
      LINKEDIN_STATE_DIR: /data
      LINKEDIN_ENABLE_FIXTURES: "true"
      LINKEDIN_ALLOW_LIVE_SENDS: "false"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - linkedin-state:/data
    ports:
      - "127.0.0.1:18096:8080"
    shm_size: 512m
    mem_limit: 1536m
    memswap_limit: 1536m
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  linkedin-state:
