# Dedicated registered multichannel mock profile; no database or volume change.
services:
  network:
    ports:
      - "127.0.0.1:5792:5791"
  simulator-bridge:
    image: acquire-agent-mode:dev
    container_name: project-acquire-agent-simulator-bridge
    working_dir: /workspace
    network_mode: "service:network"
    volumes:
      - ../..:/workspace:ro
    command: ["node", "/workspace/ops/agent-mode/simulator-transports.mjs"]
    environment:
      AGENT_MODE_COMMUNICATIONS_MODE: simulator
      AGENT_MODE_COMMUNICATIONS_PROFILE: multichannel
      NODE_ENV: development
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
