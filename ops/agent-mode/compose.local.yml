name: acquire-agent-mode

x-base: &base
  image: acquire-agent-mode:dev
  working_dir: /workspace
  volumes:
    - ../..:/workspace:ro
    - agent-node-modules:/workspace/node_modules
    - agent-next:/workspace/.next
    - ../../.local-data/agent-mode-orbstack/next-env.d.ts:/workspace/next-env.d.ts
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    WRANGLER_SEND_METRICS: "false"

services:
  postgres:
    image: postgres:17-alpine
    container_name: project-acquire-agent-postgres
    environment:
      POSTGRES_DB: acquire_agent_mode
      POSTGRES_USER: project_acquire
      POSTGRES_PASSWORD: agent-local-only
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_acquire -d acquire_agent_mode"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  dependencies:
    <<: *base
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "/workspace/ops/agent-mode/install.mjs"]
    volumes:
      - ../..:/workspace:ro
      - agent-node-modules:/install/node_modules
      - ${HOME}/Library/pnpm/store:/root/.local/share/pnpm/store
    restart: "no"
  app:
    <<: *base
    container_name: project-acquire-agent-mode
    command: ["node", "node_modules/next/dist/bin/next", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    env_file:
      - ../../.local-data/agent-mode-orbstack/runtime.env
    ports:
      - "127.0.0.1:3026:3000"
      # Narrow setup callback gateway only; communications API stays loopback.
      - "127.0.0.1:5462:5462"
    labels:
      dev.orbstack.domains: acquire-agent.orb.local
      dev.orbstack.http-port: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      dependencies:
        condition: service_completed_successfully
    restart: unless-stopped
  transports:
    <<: *base
    container_name: project-acquire-agent-transports
    network_mode: "service:app"
    command: ["node", "/workspace/ops/agent-mode/loopback-transports.mjs"]
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  agent:
    <<: *base
    container_name: project-acquire-agent-worker
    network_mode: "service:app"
    command: ["node", "/workspace/ops/agent-mode/native-worker.mjs"]
    env_file:
      - ../../.local-data/agent-mode-orbstack/runtime.env
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  research:
    <<: *base
    image: node:22.12.0
    container_name: project-acquire-agent-research
    # Keep the existing loopback-only Worker callback policy intact.
    network_mode: "service:app"
    command: ["node", "node_modules/wrangler/bin/wrangler.js", "dev", "--local", "--config", "/config/wrangler.json", "--ip", "0.0.0.0", "--port", "8787", "--inspector-port", "0", "--persist-to", "/state", "--show-interactive-dev-session=false"]
    environment:
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "false"
      WRANGLER_SEND_METRICS: "false"
    volumes:
      - ../..:/workspace:ro
      - agent-node-modules:/workspace/node_modules
      - ../../.local-data/agent-mode-orbstack/wrangler.json:/config/wrangler.json:ro
      # Wrangler reads bindings from .dev.vars next to its configuration.
      - ../../.local-data/agent-mode-orbstack/worker.env:/config/.dev.vars:ro
      - agent-research-state:/state
    depends_on:
      transports:
        condition: service_started
      app:
        condition: service_started
      dependencies:
        condition: service_completed_successfully
    restart: unless-stopped
  communications:
    <<: *base
    profiles: ["mailbox-setup"]
    container_name: project-acquire-agent-communications
    network_mode: "service:app"
    command: ["node", "/workspace/.local-data/communications/service-build/service.cjs", "--serve"]
    env_file:
      - ../../.local-data/agent-mode-orbstack/communications-service.env
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  setup-callback:
    <<: *base
    profiles: ["mailbox-setup"]
    container_name: project-acquire-agent-setup-callback
    network_mode: "service:app"
    command: ["node", "/workspace/ops/agent-mode/setup-callback-gateway.mjs"]
    environment:
      AGENT_SETUP_GATEWAY_HOST: "0.0.0.0"
    depends_on:
      communications:
        condition: service_started
    restart: unless-stopped

volumes:
  agent-node-modules:
  agent-next:
  agent-research-state:
  agent-postgres:
