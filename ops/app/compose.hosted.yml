name: acquire-app
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to a verified immutable release tag}
    env_file:
      - path: .env.hosted
        format: raw
    environment:
      NODE_ENV: production
      ALLOW_REAL_PERSONAL_DATA: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      MANUFACTURING_DIRECTORY_DATA_PATH: /app/.local-data/manufacturing-search-index.json
    ports:
      - "127.0.0.1:18098:3000"
    init: true
    restart: unless-stopped
    mem_limit: 1400m
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - next-cache:/app/.next/cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  next-cache:
