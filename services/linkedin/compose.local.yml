name: acquire-linkedin-local
services:
  linkedin:
    build: .
    container_name: project-acquire-linkedin
    env_file: ../../.local-data/linkedin/service.env
    environment:
      LINKEDIN_PUBLIC_URL: http://127.0.0.1:18096
      LINKEDIN_MAX_WORKERS: "2"
      LINKEDIN_STATE_DIR: /data
    volumes:
      - ../../.local-data/linkedin/state:/data
    ports:
      - "127.0.0.1:18096:8080"
    shm_size: 1gb
    mem_limit: 3g
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
